<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tobias Meixner">
  <!-- Echtes Vektor-Favicon, abgeleitet aus der Wortmarke in der Navigation
       (index.html: circle + zwei runde Striche). Die vorherige Datei war eine
       SVG-Huelle um zwei base64-PNGs von je 2,1 MB — beide byte-identisch,
       wodurch der Hell/Dunkel-Umschalter darin wirkungslos war. 5,68 MB, an
       jeden Besucher ausgeliefert, fuer ein 16-Pixel-Icon.
       Der Umschalter ist hier echt: auf dunklen Tab-Leisten wuerde das
       Markenblau #0C147A absaufen, deshalb dort der helle Akzent. -->
  <style>
    .m-bar { stroke: #0C147A; }
    .m-dot { fill: #72C5E8; }
    @media (prefers-color-scheme: dark) {
      .m-bar { stroke: #7DD3FC; }
      .m-dot { fill: #E8F6FD; }
    }
  </style>
  <g transform="translate(100 100) scale(1.06) translate(-117.5 -96)">
    <circle class="m-dot" cx="58" cy="114" r="18"/>
    <g class="m-bar" fill="none" stroke-width="42" stroke-linecap="round">
      <line x1="76" y1="68" x2="106" y2="124"/>
      <line x1="144" y1="68" x2="174" y2="124"/>
    </g>
  </g>
</svg>
